name: Publish to npm

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: npm-publish
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build

      - name: Resolve version
        id: version
        run: |
          NAME=$(node -p "require('./package.json').name")
          LOCAL=$(node -p "require('./package.json').version")
          if npm view "$NAME@$LOCAL" version >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$NAME@$LOCAL ja existe no npm, nada a publicar"
          else
            LAST_TAG=$(git tag --list 'v*' --sort=-v:refname | head -1)
            LAST=${LAST_TAG#v}
            if [ -n "$LAST" ]; then
              HIGHEST=$(printf '%s\n%s\n' "$LAST" "$LOCAL" | sort -V | tail -1)
              if [ "$LOCAL" = "$LAST" ] || [ "$HIGHEST" != "$LOCAL" ]; then
                echo "::error::versao $LOCAL nao e maior que a ultima tag $LAST_TAG"
                exit 1
              fi
            fi
            if ! grep -Eq "^## \[?${LOCAL//./\\.}\]?( |$)" CHANGELOG.md; then
              echo "::error::CHANGELOG.md sem entrada '## $LOCAL'"
              exit 1
            fi
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$LOCAL" >> "$GITHUB_OUTPUT"

      - name: Publish
        if: steps.version.outputs.publish == 'true'
        run: npm publish --access public --provenance

      - name: Tag and release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.version }}
        run: |
          git tag "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" --title "$TAG" --generate-notes
